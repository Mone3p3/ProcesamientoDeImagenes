<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escanea un escudo — Tocar Base</title>
<meta name="theme-color" content="#0a0a0a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-screen">

<main>
  <!-- =========================================================================
       Pantalla del escáner — "lienzo en blanco" a propósito.
       Todo lo que depende de la cámara queda sin programar; ya están el
       botón, el flujo hacia la siguiente página y los textos de instrucciones.
       ========================================================================= -->
  <div class="app-screen-top">
    <a href="index.html" class="circle-btn" id="scannerBack" aria-label="Regresar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h2 class="app-screen-title">Escanea un escudo</h2>
    <button class="circle-btn" id="scannerInfo" aria-label="Ver instrucciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="camera-canvas">
    <div class="scan-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <p class="canvas-placeholder-text">Aquí irá la vista de la cámara<br><small>(pendiente de programar)</small></p>
  </div>

  <!-- Enlace temporal solo para poder previsualizar la siguiente página;
       bórralo cuando conectes la detección real de la cámara. -->
  <a class="dev-link" id="scannerContinueDemo" href="ar-modelo.html">Simular escaneo detectado → ver modelo 3D</a>
</main>

<!-- Modal de instrucciones: cómo escanear un escudo -->
<div class="instructions-modal" id="arInstructionsModal">
  <div class="instructions-card">
    <p>Apunta con la cámara a la parte trasera de una tarjeta bisontina.</p>
    <p>Haz que el escudo quede dentro del recuadro blanco.</p>

    <div class="instructions-example">
      <div class="example-card">FRENTE</div>
      <svg class="example-arrow" width="60" height="40" viewBox="0 0 60 40" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6c14 4 30 14 50 26" stroke-linecap="round"/><path d="M46 26l8 6-9 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="example-card shield-face">
        <div class="mini-shield">TM</div>
      </div>
    </div>

    <button class="btn-solid btn-block" id="arInstructionsOk">OK</button>
  </div>
</div>

<script src="js/ar-escaner.js"></script>
</body>
</html>
