<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Out — Tocar Base</title>
<meta name="theme-color" content="#0a0a0a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-screen">

<main>
  <div class="app-screen-top">
    <a href="index.html" class="circle-btn" id="gameIntroBack" aria-label="Regresar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span></span>
    <button class="circle-btn" id="gameIntroInfo" aria-label="Ver instrucciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="game-intro-content">
    <h1 class="game-title">Base Out</h1>
    <p class="game-tagline">Destruye todos los bloques y no pierdas tu bola</p>
  </div>

  <div class="game-intro-art"></div>

  <a class="btn-solid btn-block game-start-btn" id="gameStartBtn" href="juego-jugar.html">Iniciar</a>
</main>

<!-- Modal de instrucciones del juego -->
<div class="instructions-modal" id="gameInstructionsModal">
  <div class="instructions-card">
    <p>Bloquea la bola para evitar que caiga mientras rebota por la pantalla.</p>
    <p>Cada que la bola toque un bloque de color lo destruirá. Destruye todos los bloques para ganar.</p>

    <div class="game-diagram wrong">
      <span class="diagram-mark">✕</span>
      <div class="diagram-box">
        <div class="diagram-paddle"></div>
        <div class="diagram-ball" style="left:22%;"></div>
      </div>
    </div>
    <div class="game-diagram right">
      <span class="diagram-mark ok">✓</span>
      <div class="diagram-box">
        <div class="diagram-paddle" style="left:30%;"></div>
        <div class="diagram-ball" style="left:62%; top:35%;"></div>
      </div>
    </div>

    <button class="btn-solid btn-block" id="gameInstructionsOk">OK</button>
  </div>
</div>

<script src="js/juego-intro.js"></script>
</body>
</html>
